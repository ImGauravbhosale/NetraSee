name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: netrasee
          POSTGRES_PASSWORD: netrasee
          POSTGRES_DB: netrasee_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U netrasee"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: uv sync

      - name: Run tests
        working-directory: backend
        env:
          NETRASEE_TEST_DATABASE_URL: postgresql+asyncpg://netrasee:netrasee@localhost:5432/netrasee_test
          NETRASEE_EVIDENCE_STORAGE_DIR: /tmp/netrasee-evidence-ci
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
